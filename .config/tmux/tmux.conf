# ~/.config/tmux/tmux.conf
# Setup: Ghostty + fish + tmux + Claude Code
# Atalhos: NATIVOS do tmux. Nada foi rebindado — as unicas teclas adicionadas
# sao prefix+u / prefix+b / prefix+K (livres no default) e prefix+R (reload).

# ─────────────────────────────────────────────────────────────
# Exigido pela doc do Claude Code
# (code.claude.com/docs/en/terminal-config#configure-tmux)
# ─────────────────────────────────────────────────────────────
# deixa OSC 9/777 (notificacao de desktop) e OSC 9;4 (barra de progresso)
# chegarem no Ghostty em vez de serem engolidos pelo tmux
set -g allow-passthrough on
# faz o tmux distinguir Shift+Enter de Enter (newline sem submeter)
# se ainda submeter, troque por: set -s extended-keys always   (tmux 3.4+)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ─────────────────────────────────────────────────────────────
# Terminal / cores (host = Ghostty, TERM=xterm-ghostty)
# ─────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"   # undercurl

# Esc sem delay: o Claude Code usa Esc pra interromper e o default de 500ms
# faz parecer travado
set -sg escape-time 10
# apps sabem quando o pane perde foco -> a notificacao "voce parece estar
# ausente" do Claude Code fica confiavel
set -g focus-events on

# ─────────────────────────────────────────────────────────────
# Opcoes (nao mexem em atalho nenhum)
# ─────────────────────────────────────────────────────────────
set -g default-shell /usr/bin/fish   # seu $SHELL e bash; sem isso o tmux da bash
set -g history-limit 50000           # default nativo e 2000
set -g mouse on                      # scroll/selecao por pane
set -g set-clipboard on              # copia via OSC 52 (Ghostty: clipboard-write = allow)

# ─────────────────────────────────────────────────────────────
# Popups portados do zellij (display-popup, tmux 3.2+)
# Teclas verificadas como livres no bind default do tmux 3.4
# ─────────────────────────────────────────────────────────────
bind b display-popup -E -w 80% -h 80% "btop"
bind K display-popup -E -w 90% -h 90% "$HOME/.local/bin/k9senv"
#   k9senv e um wrapper do k9s que vive fora deste repo (~/.local/bin):
#   e especifico do trabalho, com nomes de cluster e namespace internos.

bind R source-file ~/.config/tmux/tmux.conf \; display "config recarregada"

# ─────────────────────────────────────────────────────────────
# craftzdog/tmux-claude-session-manager  (via tpm, declarado no fim do arquivo)
#   prefix+y  abre/reataca o claude do diretorio atual, num popup
#   prefix+d  fecha o popup (o claude segue rodando)
#   prefix+u  picker de todos os agentes, com status e preview ao vivo
# Substitui os nossos claude-scratch.sh / claude-agents.sh / claude-popup.sh
# da epoca do zellij (que saiu de uso -- os scripts seguem em
# ~/.config/zellij/scripts/ so como referencia).
# ─────────────────────────────────────────────────────────────
# opcoes DEVEM vir antes do plugin carregar
set -g @claude_args           '--dangerously-skip-permissions'
set -g @claude_popup_width    '85%'
set -g @claude_popup_height   '85%'

# ─────────────────────────────────────────────────────────────
# Tema
# ─────────────────────────────────────────────────────────────
source-file ~/.config/tmux/solarized_osaka_dark.tmux

# ─────────────────────────────────────────────────────────────
# tpm — Tmux Plugin Manager
#   prefix+I      instala o que falta        prefix+U      atualiza tudo
#   prefix+alt+u  remove o que saiu da lista
# TMUX_PLUGIN_MANAGER_PATH aponta pro nosso diretorio XDG em vez do
# ~/.tmux/plugins default — o clone que ja existe la e reaproveitado.
# Esta linha tem que ser a ULTIMA do arquivo.
# ─────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'craftzdog/tmux-claude-session-manager'
run '~/.config/tmux/plugins/tpm/tpm'
